# Application example properties (do NOT commit secrets)

# Server
server.port=8080

# Datasource (use env vars or override in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docprocessor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# JWT
# Use a strong secret in production (store in vault or env var)
jwt.secret=${JWT_SECRET:change_this_to_a_strong_secret}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# File storage
storage.location=${STORAGE_LOCATION:uploads}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rabbitmq.queue.name=${RABBITMQ_QUEUE:document.processing.queue}

# Redis (optional)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Email (disabled by default)
app.email.enabled=false
app.email.from=${APP_EMAIL_FROM:no-reply@example.com}
#spring.mail.host=
#spring.mail.port=
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# WebSocket (STOMP endpoint)
spring.web.socket.endpoint=/ws

# Logging
logging.level.root=INFO
logging.level.com.docprocessor=DEBUG

# Other
# Use environment variables to override any values above in production

