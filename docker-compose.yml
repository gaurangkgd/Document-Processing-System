version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: docprocessor-postgres
    environment:
      POSTGRES_DB: docprocessor
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: docprocessor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: docprocessor-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: